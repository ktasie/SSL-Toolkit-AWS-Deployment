# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name aws-ssltools.virtualsolutionsng.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS application server
server {
    listen 443 ssl;
    server_name aws-ssltools.virtualsolutionsng.com;

    ssl_certificate /etc/letsencrypt/live/aws-ssltools.virtualsolutionsng.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aws-ssltools.virtualsolutionsng.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}